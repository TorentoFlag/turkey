services:
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: turkiye-minio-root
      MINIO_ROOT_PASSWORD: turkiye-minio-root-password
    ports:
      - "127.0.0.1:${MINIO_BIND_PORT:-9000}:9000"
    volumes:
      - turkiye-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: turkiye-minio-root
      MINIO_ROOT_PASSWORD: turkiye-minio-root-password
      MINIO_BUCKET: turkiye-catalog-media
      MINIO_ACCESS_KEY: catalog-media-test-key
      MINIO_SECRET_KEY: catalog-media-test-secret
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" || true
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]},{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/products/*"]}]}' > /tmp/catalog-media-policy.json
        mc admin policy create local catalog-media-app /tmp/catalog-media-policy.json || true
        mc admin policy attach local catalog-media-app --user "$$MINIO_ACCESS_KEY"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: turkiye
      POSTGRES_PASSWORD: turkiye
      POSTGRES_DB: turkiye
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - turkiye-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turkiye -d turkiye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  turkiye-postgres-data:
  turkiye-minio-data:
