services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: turkiye
      POSTGRES_PASSWORD: turkiye
      POSTGRES_DB: turkiye
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - turkiye-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turkiye -d turkiye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  turkiye-postgres-data:
